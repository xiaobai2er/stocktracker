name: Deploy Taiwan market brief

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Taiwan time (UTC+8): before the open, every 15 minutes during market hours,
    # and once after the close. Scheduled runs can be delayed by GitHub.
    - cron: '50 0 * * 1-5'
    - cron: '*/15 1-5 * * 1-5'
    - cron: '0 6 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare static site and fetch official market data
        env:
          YAHOO_PROXY_URL: ${{ secrets.YAHOO_PROXY_URL }}
          YAHOO_PROXY_TOKEN: ${{ secrets.YAHOO_PROXY_TOKEN }}
        run: |
          mkdir -p site/data
          cp index.html styles.css app.js config.js site/
          if ! python scripts/fetch_market_data.py site/data/market.json; then
            echo "Market refresh failed; reusing the last successfully published snapshot."
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 \
              "https://xiaobai2er.github.io/stocktracker/data/market.json?fallback=${GITHUB_SHA}" \
              --output site/data/market.json
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
